name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: ./build_gpu.sh
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
          name: build-artifacts
          path: *.exe
